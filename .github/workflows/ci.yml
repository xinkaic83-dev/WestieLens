name: CI

# CI：扩展类型/单测/构建、Java 参考实现单测和隔离浏览器集成。
# 端到端使用 Playwright Chromium 无头模式，外部模型/词典由本地 stub 替换。
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (JDK 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn -B test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  extension:
    name: Extension (Node 22 / WXT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run compile
      - name: Unit tests
        run: npm test
      - name: Build (chrome-mv3)
        run: npm run build
      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: extension/.output/chrome-mv3
          if-no-files-found: error

  e2e:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install and build extension
        working-directory: extension
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run browser integration
        working-directory: extension
        env:
          E2E_BROWSER: chromium
        run: npm run e2e
