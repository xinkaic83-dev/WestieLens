# 本地服务仅绑定回环地址，禁止 0.0.0.0（说明书 §4.6.1 / §11.2）
server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: ReadWiseEnglish
  # 本机密钥写在 application-local.yml（已在 .gitignore 中，绝不提交）；
  # optional 前缀表示文件不存在也不报错（§4.6）。同时兼容
  # "在 backend/ 下启动" 与 "在仓库根目录启动" 两种方式。
  config:
    import:
      - "optional:file:./application-local.yml"
      - "optional:file:./backend/application-local.yml"

# CORS 仅允许扩展来源；开发期放开 chrome-extension://*，
# 正式发布前应改为固定扩展 ID（§4.6.1）
cors:
  allowed-origin-patterns: "chrome-extension://*"

# 请求频率限制（§4.6.1 / R6）：本地后端虽然只监听回环地址，
# 仍可能被网页意外触发或滥用，从而烧掉大模型额度。
rate-limit:
  enabled: true
  # 每个客户端（回环地址按扩展来源聚合）每分钟允许的请求数
  permits-per-minute: 30

# DeepSeek 接入（§4.3 / §11.2）：模型名集中在配置项管理，联调前核对官方模型列表（R5）
deepseek:
  # 密钥不落在此文件：优先读环境变量 DEEPSEEK_API_KEY，本机开发可由 application-local.yml 覆盖
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  # 2026-10 实测 /models 返回 deepseek-flash（DeepSeek-V4.1-Flash）与 deepseek-v4-pro
  model: deepseek-flash
  # 关闭思考：实测 2.2s vs 6.0s，completion 360 vs 955（§3.1 要求非思考模式）
  thinking-enabled: false

# HTTP 动态超时（§4.2）：connect 5s；read 按文本长度 15s / 45s
http:
  connect-timeout-ms: 5000
  read-timeout-short-ms: 15000
  read-timeout-long-ms: 45000
  long-text-threshold: 100

# 词典主数据源（§4.4）：Free Dictionary API，免 Key；超时取较短值，失败即转 AI 兜底
dictionary:
  base-url: https://api.dictionaryapi.dev/api/v2/entries/en
  connect-timeout-ms: 5000
  read-timeout-ms: 8000

# 后端有界缓存（§4.5）：最大 1000 条，TTL 24h
cache:
  max-size: 1000
  ttl-hours: 24
